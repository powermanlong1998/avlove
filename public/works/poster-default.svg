<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#4a3a5e"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b8a"/>
      <stop offset="1" stop-color="#ffa07a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <!-- 装饰圆点矩阵 -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="60"  cy="80"  r="3"/>
    <circle cx="100" cy="80"  r="3"/>
    <circle cx="140" cy="80"  r="3"/>
    <circle cx="180" cy="80"  r="3"/>
    <circle cx="60"  cy="120" r="3"/>
    <circle cx="100" cy="120" r="3"/>
    <circle cx="140" cy="120" r="3"/>
    <circle cx="60"  cy="160" r="3"/>
    <circle cx="100" cy="160" r="3"/>
  </g>
  <!-- 中央胶片图标 -->
  <g transform="translate(140,210)" fill="#ffffff" opacity="0.85">
    <rect x="0" y="0" width="120" height="140" rx="6" fill="none" stroke="#fff" stroke-width="3"/>
    <rect x="0" y="20" width="120" height="6" fill="#fff"/>
    <rect x="0" y="114" width="120" height="6" fill="#fff"/>
    <circle cx="14" cy="10" r="4" fill="#2c3e50"/>
    <circle cx="106" cy="10" r="4" fill="#2c3e50"/>
    <circle cx="14" cy="130" r="4" fill="#2c3e50"/>
    <circle cx="106" cy="130" r="4" fill="#2c3e50"/>
    <text x="60" y="80" font-family="serif" font-size="36" fill="#fff" text-anchor="middle" font-weight="700">FILM</text>
  </g>
  <!-- 顶部丝带 -->
  <rect x="0" y="50" width="400" height="44" fill="url(#ribbon)" opacity="0.92"/>
  <text x="200" y="78" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="4">AVLOVE</text>
  <!-- 底部标题占位 -->
  <text x="200" y="450" font-family="serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">代表作品</text>
  <text x="200" y="480" font-family="sans-serif" font-size="13" fill="#ffe0e8" text-anchor="middle" letter-spacing="2">FEATURED WORK</text>
  <line x1="160" y1="500" x2="240" y2="500" stroke="#ff6b8a" stroke-width="2"/>
  <text x="200" y="525" font-family="sans-serif" font-size="11" fill="#aaa" text-anchor="middle">— 作品封面占位 —</text>
</svg>
